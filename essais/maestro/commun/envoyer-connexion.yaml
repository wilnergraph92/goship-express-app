# Envoie le formulaire de connexion et attend l'écran ${ATTENDU}.
# Entrée sur le mot de passe envoie le formulaire et ferme le clavier (hideKeyboard n'est
# pas fiable sur Android avec un champ React Native). Mais le simulateur iOS perd parfois
# cette touche : l'écran reste alors tel quel, formulaire rempli. Dans ce cas seulement
# (l'écran attendu n'est pas venu), on touche « Se connecter », comme le ferait le
# client. Une connexion déjà partie n'est jamais envoyée deux fois : l'écran ignore le
# bouton tant qu'elle est en cours (lib/session.js, app/connexion.jsx).
# Rangé dans commun/ : `maestro test essais/maestro/` ne lance que les parcours du dossier.
appId: com.goshipexpress.app
name: Envoyer la connexion
---
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: ${ATTENDU}
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: ${ATTENDU}
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - hideKeyboard:
                optional: true
      - scrollUntilVisible:
          element:
            id: connexion-entrer
          direction: DOWN
      - tapOn:
          id: connexion-entrer
      - extendedWaitUntil:
          visible:
            id: ${ATTENDU}
          timeout: 30000
